[package]
name = "verge-application"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[dependencies]
flate2 = "1.1"
# 应用更新：解析 GitHub Releases JSON（serde/serde_json）与校验下载摘要（sha2），
# 均为本 workspace 既有依赖，不引入新的第三方生态。
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
verge-config = { path = "../verge-config" }
verge-core = { path = "../verge-core" }
verge-domain = { path = "../verge-domain" }
verge-platform = { path = "../verge-platform" }

# macOS 使用系统 TLS。当前部分网络环境会在 rustls 直连 GitHub Release 时
# 提前断开握手，而 Security.framework 与系统 curl 可以正常完成同一请求。
[target.'cfg(target_os = "macos")'.dependencies]
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "native-tls"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "rustls-tls"] }
