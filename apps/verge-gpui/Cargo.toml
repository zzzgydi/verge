[package]
name = "verge-gpui"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[dependencies]
futures = "0.3"
getrandom = "0.4"
serde_json = "1.0"
gpui = { git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = [
    "font-kit",
] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "0e2fb7acdf1d40d4db3d458da3893fe9865e901e" }
gpui-component-assets = { git = "https://github.com/longbridge/gpui-component", rev = "0e2fb7acdf1d40d4db3d458da3893fe9865e901e" }
verge-domain = { path = "../../crates/verge-domain" }
verge-ipc = { path = "../../crates/verge-ipc" }
verge-platform = { path = "../../crates/verge-platform" }
verge-runtime = { path = "../../crates/verge-runtime" }
verge-ui = { path = "../../crates/verge-ui" }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed", features = [
    "test-support",
] }
