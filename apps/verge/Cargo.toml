[package]
name = "verge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[lib]
name = "verge"
path = "src/lib.rs"

[[bin]]
name = "verge-gpui"
path = "src/main.rs"

[dependencies]
flate2 = "1.1"
fs2 = "0.4"
futures = "0.3"
getrandom = "0.4"
libc = "0.2"
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
tungstenite = "0.30"
gpui-kit = "0.6.1"
verge-helper-protocol = { path = "../../crates/verge-helper-protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
auto-launch = "0.6"
dispatch2 = "0.3"
global-hotkey = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "native-tls"] }
smappservice-rs = "0.1.3"
security-framework = "3.7"
tokio = { version = "1", features = ["rt", "time", "macros", "sync"] }
sysproxy = { git = "https://github.com/zzzgydi/sysproxy-rs", branch = "main", default-features = false }
tray-icon = "0.21"

[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.11.27", default-features = false, features = ["blocking", "rustls-tls"] }

[dev-dependencies]
gpui-kit = { version = "0.6.1", features = ["test-support"] }
verge-helper = { path = "../verge-helper" }
