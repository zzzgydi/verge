[package]
name = "verge"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
publish = false

[lib]
name = "verge"
path = "src/lib.rs"

[[bin]]
name = "verge-gpui"
path = "src/main.rs"

[dependencies]
boa_engine = "=0.22.0"
chrono = "0.4.45"
flate2 = "1.1.10"
fs2 = "0.4.3"
futures = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
libc = "0.2.190"
markdown = "1.0.0"
percent-encoding = "2.3.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
tungstenite = "0.30.0"
gpui-kit = { version = "0.7.1", features = ["tree-sitter-yaml", "tree-sitter-javascript"] }
verge-helper-protocol = { path = "../../crates/verge-helper-protocol" }

[target.'cfg(target_os = "macos")'.dependencies]
auto-launch = "0.6.0"
block2 = "0.6.2"
dispatch2 = "0.3.1"
global-hotkey = "0.8.0"
image = { version = "0.25.10", default-features = false, features = ["png"] }
native-tls = "0.2.18"
objc2 = "0.6.5"
objc2-app-kit = "0.3.2"
objc2-foundation = "0.3.2"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
smappservice-rs = "0.1.3"
tokio = { version = "1.53.2", features = ["rt", "time", "macros", "sync"] }
sysproxy = { git = "https://github.com/zzzgydi/sysproxy-rs", branch = "main", default-features = false }
tray-icon = "0.26.1"

[target.'cfg(not(target_os = "macos"))'.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls"] }

[dev-dependencies]
gpui-kit = { version = "0.7.1", features = ["test-support"] }
verge-helper = { path = "../verge-helper" }

[build-dependencies]
serde = "1.0.229"
serde_json = "1.0.151"
